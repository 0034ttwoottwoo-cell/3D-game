<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Game Multi-Player Sync</title>
  
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #1a1a1a;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #ffffff;
      overflow: hidden;
    }

    .auth-container {
      background-color: #2a2a2a;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      width: 300px;
      text-align: center;
      z-index: 10;
    }

    .auth-container h2 {
      margin-bottom: 20px;
    }

    .input-group {
      margin-bottom: 15px;
      text-align: left;
    }

    .input-group label {
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
    }

    .input-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #444;
      border-radius: 5px;
      background-color: #333;
      color: #fff;
      box-sizing: border-box;
    }

    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 5px;
      background-color: #4CAF50;
      color: white;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }

    .btn:hover {
      background-color: #45a049;
    }

    .toggle-text {
      margin-top: 15px;
      font-size: 12px;
      color: #aaa;
      cursor: pointer;
      text-decoration: underline;
    }

    .character-select-container {
      display: none;
      background-color: #2a2a2a;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      width: 320px;
      text-align: center;
      z-index: 10;
    }

    .character-card {
      border: 2px solid #555;
      border-radius: 8px;
      padding: 15px;
      margin-top: 15px;
      background-color: #333;
      cursor: pointer;
      transition: all 0.3s;
    }

    .character-card:hover {
      border-color: #4CAF50;
      background-color: #3e3e3e;
    }

    #webgl-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      outline: none;
    }

    .player-count-info {
      position: absolute;
      top: 20px;
      right: 20px;
      background-color: rgba(0, 0, 0, 0.7);
      padding: 10px 15px;
      border-radius: 5px;
      font-size: 14px;
      z-index: 5;
      display: none;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <div class="auth-container" id="auth-container">
    <h2 id="form-title">로그인</h2>
    <div class="input-group">
      <label for="email">이메일</label>
      <input type="email" id="email" placeholder="이메일을 입력하세요">
    </div>
    <div class="input-group">
      <label for="password">비밀번호</label>
      <input type="password" id="password" placeholder="비밀번호를 입력하세요">
    </div>
    <button class="btn" id="auth-btn">로그인</button>
    <div class="toggle-text" id="toggle-btn">회원가입 하러가기</div>
  </div>

  <div class="character-select-container" id="character-select-container">
    <h2>캐릭터 선택</h2>
    <p>게임에 사용할 캐릭터를 선택하세요.</p>
    <div class="character-card" id="select-npc-card">
      <h3>플레이어 캐릭터</h3>
      <p>(test/NPC.glb)</p>
    </div>
  </div>

  <div class="player-count-info" id="player-count-info">
    접속 인원: <span id="current-players">0</span> / <span id="max-players">10</span> 명
  </div>

  <canvas id="webgl-canvas" tabindex="0"></canvas>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      createUserWithEmailAndPassword, 
      signInWithEmailAndPassword 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getDatabase, 
      ref, 
      set, 
      onValue, 
      onDisconnect, 
      remove,
      onChildAdded,
      onChildChanged,
      onChildRemoved
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDZgXV53QKRYT_5Ke61Rh0gcwOv-xRoS9w",
      authDomain: "test-game-efa98.firebaseapp.com",
      projectId: "test-game-efa98",
      storageBucket: "test-game-efa98.firebasestorage.app",
      messagingSenderId: "422304680649",
      appId: "1:422304680649:web:da46fb85d221cbe08f9b18",
      measurementId: "G-ET7MK2Z10D"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const database = getDatabase(app);

    const MAX_PLAYERS = 10;
    let isLoginMode = true;
    let myUserId = null;
    let selectedModelName = 'NPC.glb';

    let scene, camera, renderer, gltfLoader;
    let playerModel = null;
    
    // 다른 유저 3D 메쉬 저장용 객체
    const otherPlayers = {};

    const keys = {
      ArrowUp: false,
      ArrowDown: false,
      ArrowLeft: false,
      ArrowRight: false,
      Space: false
    };

    const moveSpeed = 0.15;
    let verticalVelocity = 0;
    const gravity = -0.015;
    const jumpStrength = 0.3;
    let isGrounded = true;
    let groundY = 0;

    document.getElementById('auth-btn').addEventListener('click', handleAuth);
    document.getElementById('toggle-btn').addEventListener('click', toggleAuthMode);
    document.getElementById('select-npc-card').addEventListener('click', () => selectCharacter('NPC.glb'));

    function toggleAuthMode() {
      isLoginMode = !isLoginMode;
      document.getElementById('form-title').innerText = isLoginMode ? "로그인" : "회원가입";
      document.getElementById('auth-btn').innerText = isLoginMode ? "로그인" : "회원가입";
      document.getElementById('toggle-btn').innerText = isLoginMode ? "회원가입 하러가기" : "로그인 하러가기";
    }

    function handleAuth() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      if (!email || !password) {
        alert("이메일과 비밀번호를 모두 입력해주세요.");
        return;
      }

      if (isLoginMode) {
        signInWithEmailAndPassword(auth, email, password)
          .then((userCredential) => {
            myUserId = userCredential.user.uid;
            alert("로그인 성공!");
            document.getElementById('auth-container').style.display = 'none';
            document.getElementById('character-select-container').style.display = 'block';
            document.getElementById('player-count-info').style.display = 'block';
          })
          .catch((error) => {
            alert("로그인 실패: " + error.message);
          });
      } else {
        createUserWithEmailAndPassword(auth, email, password)
          .then(() => {
            alert("회원가입 성공! 로그인 해주세요.");
            toggleAuthMode();
          })
          .catch((error) => {
            alert("회원가입 실패: " + error.message);
          });
      }
    }

    function selectCharacter(modelName) {
      selectedModelName = modelName;
      document.getElementById('character-select-container').style.display = 'none';
      
      init3DScene();
      loadPlayerModel(modelName);
      
      setupMultiplayer();

      const canvas = document.getElementById('webgl-canvas');
      if (canvas) canvas.focus();
    }

    // 상대방 캐릭터 모델 생성 (GLTF 모델 로드 실패 시 파란 상자로 대체)
    function createOtherPlayerMesh(userId, initialData) {
      const group = new THREE.Group();
      scene.add(group);
      
      if (initialData && initialData.x !== undefined) {
        group.position.set(initialData.x, initialData.y || 0, initialData.z || 0);
      }

      // 3D 모델 파일 로드
      gltfLoader.load(
        `test/${selectedModelName}`,
        (gltf) => {
          const model = gltf.scene;
          model.scale.set(1, 1, 1);
          group.add(model);
        },
        undefined,
        () => {
          // 로딩 실패 시 기본 파란 상자 렌더링
          const geometry = new THREE.BoxGeometry(1, 1, 1);
          const material = new THREE.MeshStandardMaterial({ color: 0x3388ff });
          const cube = new THREE.Mesh(geometry, material);
          cube.position.y = 0.5;
          group.add(cube);
        }
      );

      return group;
    }

    // 멀티플레이어 동기화 로직
    function setupMultiplayer() {
      const playersRef = ref(database, 'players');
      const myPlayerRef = ref(database, `players/${myUserId}`);

      // 접속 종료 시 내 데이터 자동 삭제
      onDisconnect(myPlayerRef).remove();

      // 최초 접속 위치 세팅
      syncMyPosition();

      // 1. 전체 접속 인원수 카운트
      onValue(playersRef, (snapshot) => {
        const data = snapshot.val() || {};
        const count = Object.keys(data).length;
        document.getElementById('current-players').innerText = count;
      });

      // 2. 다른 유저가 들어왔을 때
      onChildAdded(playersRef, (snapshot) => {
        const userId = snapshot.key;
        const pData = snapshot.val();

        if (userId === myUserId) return; // 나 자신 제외

        if (!otherPlayers[userId]) {
          otherPlayers[userId] = createOtherPlayerMesh(userId, pData);
        }
      });

      // 3. 다른 유저가 움직였을 때
      onChildChanged(playersRef, (snapshot) => {
        const userId = snapshot.key;
        const pData = snapshot.val();

        if (userId === myUserId) return;

        if (otherPlayers[userId]) {
          otherPlayers[userId].position.set(pData.x, pData.y, pData.z);
        } else {
          otherPlayers[userId] = createOtherPlayerMesh(userId, pData);
        }
      });

      // 4. 다른 유저가 나갔을 때
      onChildRemoved(playersRef, (snapshot) => {
        const userId = snapshot.key;
        if (otherPlayers[userId]) {
          scene.remove(otherPlayers[userId]);
          delete otherPlayers[userId];
        }
      });
    }

    // 내 위치 정보 서버 전송
    function syncMyPosition() {
      if (!playerModel || !myUserId) return;
      
      const myPlayerRef = ref(database, `players/${myUserId}`);
      set(myPlayerRef, {
        x: playerModel.position.x,
        y: playerModel.position.y,
        z: playerModel.position.z,
        lastSeen: Date.now()
      });
    }

    window.addEventListener('keydown', (event) => {
      if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space", " "].includes(event.key) || 
          ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(event.code)) {
        event.preventDefault();
      }

      if (event.key === 'ArrowUp' || event.code === 'ArrowUp') keys.ArrowUp = true;
      if (event.key === 'ArrowDown' || event.code === 'ArrowDown') keys.ArrowDown = true;
      if (event.key === 'ArrowLeft' || event.code === 'ArrowLeft') keys.ArrowLeft = true;
      if (event.key === 'ArrowRight' || event.code === 'ArrowRight') keys.ArrowRight = true;
      if (event.key === ' ' || event.code === 'Space') keys.Space = true;
    });

    window.addEventListener('keyup', (event) => {
      if (event.key === 'ArrowUp' || event.code === 'ArrowUp') keys.ArrowUp = false;
      if (event.key === 'ArrowDown' || event.code === 'ArrowDown') keys.ArrowDown = false;
      if (event.key === 'ArrowLeft' || event.code === 'ArrowLeft') keys.ArrowLeft = false;
      if (event.key === 'ArrowRight' || event.code === 'ArrowRight') keys.ArrowRight = false;
      if (event.key === ' ' || event.code === 'Space') keys.Space = false;
    });

    function createFallbackCube() {
      const geometry = new THREE.BoxGeometry(1, 1, 1);
      const material = new THREE.MeshStandardMaterial({ color: 0x4CAF50 });
      playerModel = new THREE.Mesh(geometry, material);
      groundY = 0.5;
      playerModel.position.set(0, groundY, 0);
      scene.add(playerModel);
    }

    function init3DScene() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0xa0a0a0);

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 5, 12);
      camera.lookAt(0, 1, 0);

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
      scene.add(ambientLight);

      const directionalLight = new THREE.DirectionalLight(0xffffff, 1.2);
      directionalLight.position.set(5, 10, 7);
      scene.add(directionalLight);

      const gridHelper = new THREE.GridHelper(20, 20);
      scene.add(gridHelper);

      const canvas = document.getElementById('webgl-canvas');
      renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);

      gltfLoader = new GLTFLoader();

      window.addEventListener('resize', onWindowResize);

      animate();
    }

    function loadPlayerModel(modelName) {
      const modelPath = `test/${modelName}`;

      gltfLoader.load(
        modelPath,
        function (gltf) {
          playerModel = gltf.scene;
          playerModel.scale.set(1, 1, 1);
          groundY = 0;
          playerModel.position.set(0, groundY, 0);
          scene.add(playerModel);
          syncMyPosition();
        },
        null,
        function (error) {
          createFallbackCube();
          syncMyPosition();
        }
      );
    }

    function onWindowResize() {
      if (!camera || !renderer) return;
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function updatePlayerMovement() {
      if (!playerModel) return;

      let moved = false;

      if (keys.ArrowUp) {
        playerModel.position.z -= moveSpeed;
        moved = true;
      }
      if (keys.ArrowDown) {
        playerModel.position.z += moveSpeed;
        moved = true;
      }
      if (keys.ArrowLeft) {
        playerModel.position.x -= moveSpeed;
        moved = true;
      }
      if (keys.ArrowRight) {
        playerModel.position.x += moveSpeed;
        moved = true;
      }

      if (keys.Space && isGrounded) {
        verticalVelocity = jumpStrength;
        isGrounded = false;
        moved = true;
      }

      if (!isGrounded) {
        verticalVelocity += gravity;
        playerModel.position.y += verticalVelocity;
        moved = true;

        if (playerModel.position.y <= groundY) {
          playerModel.position.y = groundY;
          verticalVelocity = 0;
          isGrounded = true;
        }
      }

      camera.position.x = playerModel.position.x;
      camera.position.z = playerModel.position.z + 12;
      camera.lookAt(playerModel.position.x, playerModel.position.y + 1, playerModel.position.z);

      if (moved) {
        syncMyPosition();
      }
    }

    function animate() {
      requestAnimationFrame(animate);

      updatePlayerMovement();

      if (renderer && scene && camera) {
        renderer.render(scene, camera);
      }
    }
  </script>
</body>
</html>
